<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MedidocAI Insights | Medical Blog</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-50 min-h-screen">
    <nav class="flex items-center justify-between px-8 py-4 bg-white border-b border-gray-100 sticky top-0 z-40">
        <div class="text-blue-700 font-extrabold text-xl tracking-tight"><a href="/">MEDIDOC<span class="text-gray-900">AI</span></a></div>
        <a href="/" class="text-sm font-semibold text-gray-600 hover:text-blue-600">← Back to Home</a>
    </nav>

    <header class="py-16 text-center">
        <h1 class="text-4xl font-extrabold text-gray-900 mb-4">MedidocAI Insights</h1>
    </header>

    <div class="max-w-5xl mx-auto px-6 pb-20">
        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8">
            {% for post in posts %}
            <a href="/blog/{{ post.slug }}" class="group block bg-white border border-gray-100 rounded-2xl shadow-sm hover:shadow-xl transition-all duration-300 p-6 hover:-translate-y-1">
                <!-- Cover Image -->
                <div class="w-full aspect-[16/9] bg-gray-100 rounded-xl mb-4 overflow-hidden">
                    <img src="/{{ post.image_url }}" alt="{{ post.title }}" class="w-full h-full object-contain">
                </div>
                
                <h2 class="text-xl font-bold mb-2 text-gray-900 group-hover:text-blue-600">{{ post.title }}</h2>
                <div class="text-xs text-gray-400 mb-4 font-semibold uppercase tracking-wider">{{ post.date }} • {{ post.author }}</div>
                <p class="text-gray-600 text-sm leading-relaxed mb-6">{{ post.excerpt }}</p>
                <div class="flex items-center text-blue-600 font-bold text-sm">
                    Read Article <i class="fa-solid fa-arrow-right ml-2 text-xs"></i>
                </div>
            </a>
            {% endfor %}
        </div>
    </div>
</body>
</html>
