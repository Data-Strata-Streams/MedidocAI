<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ post.title }} | MedidocAI Insights</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-50 min-h-screen">

    <!-- NAVBAR -->
    <nav class="flex items-center justify-between px-8 py-4 bg-white border-b border-gray-100 sticky top-0 z-40">
        <div class="text-blue-700 font-extrabold text-xl tracking-tight">
            <a href="/">MEDIDOC<span class="text-gray-900">AI</span></a>
        </div>
        <a href="/blogs" class="text-sm font-semibold text-gray-600 hover:text-blue-600">← Back to Blog</a>
    </nav>

    <!-- ARTICLE CONTENT -->
    <main class="max-w-3xl mx-auto px-6 py-16">
        <article class="bg-white p-8 md:p-12 rounded-3xl shadow-sm border border-gray-100">
            
            <!-- Smart Image Handling -->
            {% if post.image_url and post.image_url != 'N/A' %}
                <div class="w-full aspect-[16/9] bg-gray-100 rounded-2xl mb-8 overflow-hidden">
                    <img src="/{{ post.image_url }}" alt="{{ post.title }}" class="w-full h-full object-contain">
                </div>
            {% else %}
                <div class="w-full aspect-[16/9] bg-gray-100 rounded-2xl mb-8 overflow-hidden">
                    <img src="/images/default.jpg" alt="Default Image" class="w-full h-full object-contain">
                </div>
            {% endif %}
            
            <div class="text-blue-600 font-bold text-sm tracking-widest uppercase mb-4">{{ post.date }}</div>
            <h1 class="text-4xl md:text-5xl font-extrabold text-gray-900 mb-6 leading-tight tracking-tight">{{ post.title }}</h1>
            <div class="flex items-center space-x-2 text-gray-500 font-medium mb-12">
                <i class="fa-solid fa-user-pen"></i>
                <span>By {{ post.author }}</span>
            </div>

            <!-- Content -->
            <div class="prose prose-blue prose-lg max-w-none text-gray-700 leading-relaxed">
                {{ post.content | safe }}
            </div>

            <!-- Smart Source Link Handling -->
            {% if post.sourceLink and post.sourceLink != 'N/A' %}
                <div class="mt-12 p-4 bg-gray-50 rounded-xl border border-gray-100 text-sm text-gray-600">
                    <strong>Original Source:</strong> 
                    <a href="{{ post.sourceLink }}" class="text-blue-600 underline hover:text-blue-800" target="_blank">View Original Article</a>
                </div>
            {% endif %}
        </article>
    </main>

</body>
</html>
