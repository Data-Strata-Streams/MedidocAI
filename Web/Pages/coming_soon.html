<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ title or 'Coming Soon' }}</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 min-h-screen flex items-center justify-center p-6">
    <div class="w-full max-w-2xl">
        <div class="rounded-3xl border border-white/10 bg-white/5 backdrop-blur-md p-8 md:p-10 shadow-2xl">
            <a href="/" class="inline-flex items-center text-sm font-semibold text-sky-200 hover:text-white">
                ← Back to home
            </a>

            <div class="mt-6">
                <div class="inline-flex items-center gap-2 rounded-full border border-white/10 bg-white/5 px-4 py-2 text-xs font-extrabold tracking-widest text-sky-200">
                    MEDIDOC AI
                </div>
                <h1 class="mt-4 text-3xl md:text-5xl font-extrabold tracking-tight text-white">
                    {{ title or 'Feature' }}
                </h1>
                <p class="mt-3 text-lg md:text-xl font-bold text-sky-200">
                    {{ subtitle or 'Coming Soon!' }}
                </p>
                <p class="mt-5 text-slate-200/80 leading-relaxed">
                    We’re building a safer, smarter pill identification experience. Check back soon.
                </p>
            </div>

            <div class="mt-8 flex flex-wrap gap-3">
                <a href="/generic-browse" class="rounded-xl bg-sky-500/15 hover:bg-sky-500/25 text-sky-100 border border-sky-400/20 px-5 py-3 font-bold transition">
                    Browse Generics
                </a>
                <a href="/manufacturer-browse" class="rounded-xl bg-white/5 hover:bg-white/10 text-white border border-white/10 px-5 py-3 font-bold transition">
                    Browse Manufacturers
                </a>
            </div>
        </div>
    </div>
</body>
</html>
