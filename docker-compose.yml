version: '3.8'

services:
  medidoc_api:
    build: .
    container_name: medidoc_api
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    env_file:
      - .env
    depends_on:
      - qdrant
      - db # Added dependency so API knows DB exists (optional strictly, but good practice)
    restart: always

  qdrant:
    image: qdrant/qdrant:latest
    container_name: medidoc_qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - ./data/vectors:/qdrant/storage
    restart: always

  # --- NEW: PostgreSQL Database ---
  db:
    image: postgres:15-alpine
    container_name: medidoc_db
    ports:
      - "5432:5432"
    env_file:
      - .env
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    restart: always

  # --- NEW: Database GUI (Adminer) ---
  adminer:
    image: adminer
    container_name: medidoc_adminer
    ports:
      - "8081:8080"
    depends_on:
      - db
    restart: always